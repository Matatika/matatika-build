{{- if and .Values.gcp.enabled .Values.gcp.createSecretStore }}
# Per-namespace SecretStore that authenticates to GCP Secret Manager via
# Workload Identity, impersonating the chart's KSA (see serviceaccount.yaml).
#
# helm.sh/resource-policy: keep prevents `helm uninstall` from deleting the
# SecretStore. Today this chart is the only consumer in the namespace, but
# the policy is defensive — if a second app starts using the same store,
# uninstalling meltano-catalog won't break it.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.gcp.secretStoreName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: {{ include "meltano-catalog.name" . }}
    helm.sh/chart: {{ include "meltano-catalog.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider:
    gcpsm:
      projectID: {{ required "gcp.projectId is required when gcp.enabled is true" .Values.gcp.projectId | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ required "gcp.cluster.location is required when gcp.enabled is true" .Values.gcp.cluster.location | quote }}
          clusterName: {{ .Values.gcp.cluster.name | default .Values.gcp.projectId | quote }}
          serviceAccountRef:
            name: {{ .Values.gcp.serviceAccountName | quote }}
{{- end }}
