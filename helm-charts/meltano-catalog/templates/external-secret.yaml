{{- if and .Values.gcp.enabled .Values.gcp.secrets }}
# Pulls each entry in .Values.gcp.secrets from GCP Secret Manager into a
# native Kubernetes Secret named "<release>-appsecrets-gcp". The deployment's
# env-var lookups (via the meltano-catalog.appsecret-name helper) resolve
# against this Secret for every key listed in .Values.gcp.secrets, and
# against the Helm-managed "<release>-appsecrets" Secret for everything else.
#
# Pre-reqs (cluster bootstrap, not provisioned by this chart):
#   1. External Secrets Operator installed in the cluster.
#   2. A SecretStore named .Values.gcp.secretStoreName exists in this
#      namespace, configured with Workload Identity to impersonate the KSA
#      that's bound to a GSA with roles/secretmanager.secretAccessor on the
#      referenced secrets.
#   3. The ESO controller has RBAC permission to create tokens
#      (serviceaccounts/token) on that KSA in this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-appsecrets-gcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "meltano-catalog.name" . }}
    helm.sh/chart: {{ include "meltano-catalog.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.gcp.secretStoreName | default "gcp-secret-manager" }}
    kind: SecretStore
  target:
    name: {{ .Release.Name }}-appsecrets-gcp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
{{- range $k, $v := .Values.gcp.secrets }}
    - secretKey: {{ $k | quote }}
      remoteRef:
        key: {{ $v | quote }}
{{- end }}
{{- end }}
