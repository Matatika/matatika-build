{{- if and .Values.gcp.enabled .Values.gcp.secrets }}
# SecretProviderClass for the GKE Secret Manager add-on.
#
# How this works:
#   1. The GKE-managed Secrets Store CSI driver (provider: gke) reads each
#      secret listed under spec.parameters.secrets at pod-mount time.
#   2. The driver projects them as files into a CSI volume the pod mounts.
#   3. The `secretObjects` block additionally syncs them into a native
#      Kubernetes Secret named "<release>-appsecrets-gcp", which the
#      deployment env vars pull from via the meltano-catalog.appsecret-name
#      helper.
#
# Important: the K8s Secret only materialises while at least one pod is
# mounting the CSI volume that references this SecretProviderClass. The
# deployment.yaml in this chart adds that mount when gcp.enabled is true.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-appsecrets-gcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "meltano-catalog.name" . }}
    helm.sh/chart: {{ include "meltano-catalog.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider: gke
  parameters:
    secrets: |
{{- range $k, $v := .Values.gcp.secrets }}
      - resourceName: "projects/{{ $.Values.gcp.projectId }}/secrets/{{ $v }}/versions/latest"
        path: "{{ $k }}"
{{- end }}
  secretObjects:
    - secretName: {{ .Release.Name }}-appsecrets-gcp
      type: Opaque
      data:
{{- range $k, $v := .Values.gcp.secrets }}
        - objectName: {{ $k | quote }}
          key: {{ $k | quote }}
{{- end }}
{{- end }}
