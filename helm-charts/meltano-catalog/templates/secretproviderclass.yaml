{{/*
This file used to template a SecretProviderClass for the GKE Secret Manager
add-on. The chart switched back to ESO because the GKE add-on doesn't ship
the secretObjects sync controller — the CSI mount succeeded but the
referenced K8s Secret was never created. See templates/external-secret.yaml.

This file is intentionally left as a no-op (renders to nothing) so that
`helm upgrade` from the previous release cleans up the old SecretProviderClass
without us having to delete the file before upgrade.

Safe to delete this file once every environment has been upgraded past the
SecretProviderClass → ESO transition.
*/}}
