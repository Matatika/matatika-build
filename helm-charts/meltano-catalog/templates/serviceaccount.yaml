{{- if .Values.gcp.enabled }}
# ServiceAccount used by the application pod and by ESO to authenticate to GCP
# Secret Manager via Workload Identity. The annotation tells GKE to exchange
# the KSA token for an IAM token impersonating .Values.gcp.serviceAccountEmail.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.gcp.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.gcp.serviceAccountEmail | quote }}
  labels:
    app.kubernetes.io/name: {{ include "meltano-catalog.name" . }}
    helm.sh/chart: {{ include "meltano-catalog.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end }}
